events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10G;

    # Gzip is fine for JSON/HTML; segments are already compressed.
    gzip on;
    gzip_types application/json application/javascript text/css text/html;

    upstream backend {
        server backend:8000;
    }

    upstream livekit_signaling {
        server livekit:7880;
    }

    upstream torrserver {
        server torrserver:8090;
    }

    # Default: 444 (close) for Host headers we don't recognise — stops random
    # bots from probing api.juntoapp.tech via direct IP.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate     /etc/letsencrypt/live/api.juntoapp.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.juntoapp.tech/privkey.pem;
        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
