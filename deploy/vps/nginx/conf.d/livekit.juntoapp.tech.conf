server {
    listen 80;
    server_name livekit.juntoapp.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name livekit.juntoapp.tech;

    ssl_certificate     /etc/letsencrypt/live/livekit.juntoapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.juntoapp.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # LiveKit signaling — pure WebSocket on /rtc, plus /twirp REST control
    location / {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
