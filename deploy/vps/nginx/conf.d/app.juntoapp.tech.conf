# Flutter Web build for app.juntoapp.tech.
# `webapp` volume is populated by deploy.sh — it copies build/web/ from
# the frontend repo into the volume.

server {
    listen 80;
    server_name app.juntoapp.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.juntoapp.tech;

    ssl_certificate     /etc/letsencrypt/live/app.juntoapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.juntoapp.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /webapp;
    index index.html;

    # Flutter Web — SPA routes, fallback to index.html for go_router paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets — cache hard.
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpe?g|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
