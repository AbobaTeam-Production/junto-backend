# app.juntoapp.tech serves both the Flutter Web build AND the API/WS
# under the same origin. Same-origin keeps the Web app off CORS, lets
# WebSocket carry cookies, and matches what `ServerConfig` does on
# kIsWeb (uses `Uri.base.origin` for both API and WS).

server {
    listen 80;
    server_name app.juntoapp.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.juntoapp.tech;

    ssl_certificate     /etc/letsencrypt/live/app.juntoapp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.juntoapp.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10G;

    # ─── API ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket (room presence/sync) ───────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ─── /admin (Django admin) ────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── /media — HLS playlists + segments ────────────────────────
    location /media/ {
        alias /media/;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        location ~ \.(ts|m4s|mp4)$ {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }

    # ─── /torrserver — HTTP streaming proxy ───────────────────────
    location /torrserver/ {
        proxy_pass http://torrserver/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        client_max_body_size 0;
    }

    # ─── /livekit — LiveKit signaling (proxy from app origin) ─────
    # Same-origin proxy so the Flutter Web client can connect with
    # `wss://app.juntoapp.tech/livekit/` and reuse cookies / TLS.
    location /livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ─── Flutter Web (SPA) ────────────────────────────────────────
    root /webapp;
    index index.html;

    # Stable filenames that change with every build — never `immutable`,
    # otherwise users keep an outdated bundle for 30 days. ETag is the
    # signal nginx will hand the browser to skip the body when nothing
    # changed.
    location = /index.html              { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js    { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js            { add_header Cache-Control "no-cache"; }
    location = /flutter.js              { add_header Cache-Control "no-cache"; }
    location = /version.json            { add_header Cache-Control "no-cache"; }
    location = /manifest.json           { add_header Cache-Control "no-cache"; }
    location = /firebase-messaging-sw.js { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything else (canvaskit/*, hashed asset chunks, fonts, images)
    # — those names DO change when content changes, safe to cache hard.
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpe?g|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
