# Production compose for Junto VPS deployment.
#
# - The backend image is pulled from ghcr.io (built by the CI workflow on
#   every push to main and on v* tags). Override with BACKEND_IMAGE=...
#   to pin a specific tag.
# - Postgres / Redis / LiveKit / jacred / torrserver run as containers.
# - nginx terminates TLS for api.juntoapp.tech / app.juntoapp.tech /
#   livekit.juntoapp.tech using certbot-issued certs from the host.
# - Bring up: `docker compose -f docker-compose.prod.yml --env-file .env up -d`

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchparty}
      POSTGRES_USER: ${POSTGRES_USER:-junto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-junto}", "-d", "${POSTGRES_DB:-watchparty}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/abobateam-production/junto-backend:main}
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-junto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watchparty}
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/media
      - TORRSERVER_URL=http://torrserver:8090
      - TORRSERVER_PUBLIC_URL=${TORRSERVER_PUBLIC_URL:-/torrserver}
      - JACRED_URL=${JACRED_URL:-http://jacred:9117}
      - JACRED_APIKEY=${JACRED_APIKEY:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_PROXY_BASE=${TMDB_PROXY_BASE:-}
      - TMDB_PROXY_SECRET=${TMDB_PROXY_SECRET:-}
      - TMDB_IMAGE_BASE=${TMDB_IMAGE_BASE:-}
    volumes:
      - media:/media
      - ./firebase:/firebase:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: ${BACKEND_IMAGE:-ghcr.io/abobateam-production/junto-backend:main}
    restart: unless-stopped
    command: celery -A config worker -l info -c 4
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-junto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watchparty}
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/media
      - TORRSERVER_URL=http://torrserver:8090
      - TORRSERVER_PUBLIC_URL=${TORRSERVER_PUBLIC_URL:-/torrserver}
      - JACRED_URL=${JACRED_URL:-http://jacred:9117}
      - JACRED_APIKEY=${JACRED_APIKEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_PROXY_BASE=${TMDB_PROXY_BASE:-}
      - TMDB_PROXY_SECRET=${TMDB_PROXY_SECRET:-}
      - TMDB_IMAGE_BASE=${TMDB_IMAGE_BASE:-}
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ${BACKEND_IMAGE:-ghcr.io/abobateam-production/junto-backend:main}
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-junto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-watchparty}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    restart: unless-stopped
    volumes:
      - torrserver-config:/opt/torrserver/config
      - torrserver-torrents:/opt/torrserver/torrents
    expose:
      - "8090"

  jacred:
    image: ghcr.io/jacred-fdb/jacred:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - jacred-config:/app/config
      - jacred-data:/app/Data
    expose:
      - "9117"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"      # signaling (proxied via nginx for wss://)
      - "7881:7881"      # RTC TCP fallback
      - "7882:7882/udp"  # RTC media
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - media:/media:ro
      - webapp:/webapp:ro
    depends_on:
      - backend
      - livekit

  certbot:
    # One-shot container kicked by deploy.sh / cron. Renews any cert with
    # less than 30 days left and signals nginx to reload.
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet && nginx -s reload 2>/dev/null; sleep 12h; done"]
    profiles: ["renew"]

volumes:
  pgdata:
  redisdata:
  media:
  webapp:
  torrserver-config:
  torrserver-torrents:
  jacred-config:
  jacred-data:
  certbot-www:
