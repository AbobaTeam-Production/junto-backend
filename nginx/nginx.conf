events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10G;

    upstream backend {
        server backend:8000;
    }

    # HTTP server: serves the same API/WS/media/livekit/torrserver paths as
    # HTTPS, without TLS. Useful for local-LAN dev (Android/desktop clients
    # that don't trust the self-signed mkcert root). Public deployments
    # should put a real cert here and 301-redirect.
    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        location /media/ {
            alias /media/;
            # hls.js sets crossOrigin='anonymous' on the <video>, which
            # triggers CORS preflight even on same-origin XHRs for HLS
            # segments. Without ACAO the MediaSource never receives any
            # data and the <video> stays detached from DOM.
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

            # HLS playlist must NOT be cached during transcode: it grows
            # as ffmpeg appends new segments, and hls.js polls it every
            # ~targetDuration/2 to discover them. A cached snapshot
            # freezes playback at the duration captured on the first
            # fetch (e.g. 04:12 for a 63-segment snapshot).
            location ~ \.m3u8$ {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                expires -1;
            }

            # Segments are immutable once written, safe to cache aggressively.
            location ~ \.(ts|m4s|mp4)$ {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
                expires 1h;
                add_header Cache-Control "public, no-transform";
            }
        }

        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /livekit/ {
            proxy_pass http://livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location /torrserver/ {
            proxy_pass http://torrserver:8090/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            client_max_body_size 0;
        }

        location / {
            root /frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # LiveKit signaling (WebSocket). The trailing slash on proxy_pass
        # strips "/livekit" from the URI so the request reaches LiveKit as /rtc?...
        location /livekit/ {
            proxy_pass http://livekit:7880/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # TorrServer streaming. Disable buffering so seeks/range requests
        # are forwarded immediately, and bump timeouts since stream sessions
        # are long-lived.
        location /torrserver/ {
            proxy_pass http://torrserver:8090/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            client_max_body_size 0;
        }

        location /media/ {
            alias /media/;
            # hls.js sets crossOrigin='anonymous' on the <video>, which
            # triggers CORS preflight even on same-origin XHRs for HLS
            # segments. Without ACAO the MediaSource never receives any
            # data and the <video> stays detached from DOM.
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

            # HLS playlist must NOT be cached during transcode: it grows
            # as ffmpeg appends new segments, and hls.js polls it every
            # ~targetDuration/2 to discover them. A cached snapshot
            # freezes playback at the duration captured on the first
            # fetch (e.g. 04:12 for a 63-segment snapshot).
            location ~ \.m3u8$ {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                expires -1;
            }

            # Segments are immutable once written, safe to cache aggressively.
            location ~ \.(ts|m4s|mp4)$ {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
                expires 1h;
                add_header Cache-Control "public, no-transform";
            }
        }

        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
