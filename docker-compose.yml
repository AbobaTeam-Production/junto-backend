services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watchparty
      POSTGRES_USER: junto
      POSTGRES_PASSWORD: junto_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "junto", "-d", "watchparty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgresql://junto:junto_secret@db:5432/watchparty
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - MEDIA_ROOT=/media
    volumes:
      - ./backend:/app
      - media:/media
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    command: celery -A config worker -l info -c 4
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://junto:junto_secret@db:5432/watchparty
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/media
      - QBITTORRENT_URL=http://host.docker.internal:8080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=adminadmin
      - TORRENT_DOWNLOAD_DIR=H:/PycharmProjects/junto_backend/media_shared/torrents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    volumes:
      - ./backend:/app
      - media:/media
      - ./media_shared/torrents:/media/torrents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://junto:junto_secret@db:5432/watchparty
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cert.pem:/etc/nginx/cert.pem:ro
      - ./nginx/key.pem:/etc/nginx/key.pem:ro
      - media:/media:ro
      - C:/Users/alexf/StudioProjects/junto_frontend/build/web:/frontend:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
